<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a3f3a"/>
      <stop offset="0.55" stop-color="#0d7a63"/>
      <stop offset="1" stop-color="#16c79a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.82" cy="0.14" r="0.65">
      <stop offset="0" stop-color="#7dffd8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7dffd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#04201e" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#04201e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c8f5e6"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b4a42"/>
      <stop offset="1" stop-color="#0f8a6c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#02231f" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow1)"/>
  <rect width="512" height="512" fill="url(#glow2)"/>

  <!-- back bubble: frosted glass with message lines -->
  <g filter="url(#shadow)">
    <path d="M148 128 H300 a38 38 0 0 1 38 38 V232 a38 38 0 0 1 -38 38 H196 L146 318 V270 a38 38 0 0 1 -36 -38 V166 a38 38 0 0 1 38 -38 Z" fill="url(#glass)" stroke="#fff" stroke-opacity="0.55" stroke-width="3"/>
  </g>
  <g stroke="#fff" stroke-linecap="round" stroke-opacity="0.9">
    <line x1="146" y1="170" x2="242" y2="170" stroke-width="14"/>
    <line x1="146" y1="206" x2="300" y2="206" stroke-width="10" stroke-opacity="0.6"/>
    <line x1="146" y1="234" x2="268" y2="234" stroke-width="10" stroke-opacity="0.6"/>
  </g>

  <!-- front bubble: bright, with the markdown mark -->
  <g filter="url(#shadow)">
    <path d="M222 236 H366 a42 42 0 0 1 42 42 V338 a42 42 0 0 1 -42 42 H340 L352 430 L296 380 H222 a42 42 0 0 1 -42 -42 V278 a42 42 0 0 1 42 -42 Z" fill="url(#front)"/>
  </g>
  <g fill="none" stroke="url(#ink)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
    <!-- M -->
    <path d="M212 342 V286 L238 318 L264 286 V342"/>
    <!-- down arrow -->
    <path d="M318 286 V340 M296 320 L318 342 L340 320"/>
  </g>
</svg>
